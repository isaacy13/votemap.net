name: CI

on:
  push:
    branches: [ main, votemap.net.dev ]
  pull_request:
    branches: [ main, votemap.net.dev ]

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  platform-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: votemap
          POSTGRES_PASSWORD: votemap_dev
          POSTGRES_DB: votemap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U votemap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: platform/backend
    env:
      DATABASE_URL: postgresql://votemap:votemap_dev@localhost:5432/votemap
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      ZKPASSPORT_DEV_MODE: "true"
      ALLOW_DEV_LOGIN: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: platform/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  platform-shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx tsc --noEmit
