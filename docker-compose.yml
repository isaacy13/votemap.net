version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: votemap
      POSTGRES_PASSWORD: votemap_dev
      POSTGRES_DB: votemap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votemap"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: votemap
      MINIO_ROOT_PASSWORD: votemap_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./platform/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://votemap:votemap_dev@postgres:5432/votemap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-secure-secret-at-least-32-chars
      JWT_EXPIRES_IN: 15m
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: votemap-proofs
      S3_ACCESS_KEY: votemap
      S3_SECRET_KEY: votemap_dev
      CORS_ORIGIN: "*"
      SOLANA_RPC_URL: https://api.devnet.solana.com
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
